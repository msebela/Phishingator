workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'

variables:
  COMPOSE_PROJECT_NAME: "${CI_PROJECT_NAME}_${CI_COMMIT_REF_SLUG}"

stages:
  - test
  - build
  - deploy

.default_before_script: &default_before_script
  - set -a
  - source <(printf "%s" "$CONFIG" | grep -E -v '^\s*#|^\s*$')
  - source "/phishingator-data/${ORG}/.env"
  - set +a
  - export FRAUDULENT_HOSTS_TRAEFIK=$(echo "$FRAUDULENT_HOSTS" | tr ',' '\n' | awk '{printf "Host(`%s`) || ", $0}' | sed 's/ || $//')

composer-audit:
  stage: test
  image: composer:2
  script:
    - cd src
    - composer validate --no-check-publish --strict
    - composer audit --locked

npm-audit:
  stage: test
  image: node:24-trixie-slim
  script:
    - cd src
    - npm audit --audit-level=moderate

php-lint:
  stage: test
  image: php:8.3-cli-trixie
  script:
    - find src -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

semgrep:
  stage: test
  image: semgrep/semgrep:1.171.0-nonroot
  script:
    - semgrep scan --config p/php --error --metrics=off src/

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:v0.11.0
  script:
    - find scripts docker -type f -name '*.sh' -print0 | xargs -0 -r shellcheck

build:
  image: docker:29.8.0-cli
  stage: build
  before_script:
    - apk add --update --no-cache git
    - *default_before_script
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker compose build --pull --no-cache
    - docker compose push
  after_script:
    - docker logout $CI_REGISTRY
  environment:
    name: $CI_COMMIT_REF_SLUG
    action: prepare

deploy:
  image: docker:29.8.0-cli
  stage: deploy
  resource_group: $CI_COMMIT_REF_SLUG
  before_script:
    - *default_before_script
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker compose pull
    - docker compose up -d --no-build --force-recreate
  after_script:
    - docker logout $CI_REGISTRY
  environment:
    name: $CI_COMMIT_REF_SLUG
    url: $WEB_URL
    on_stop: stop

stop:
  image: docker:29.8.0-cli
  stage: deploy
  resource_group: $CI_COMMIT_REF_SLUG
  before_script:
    - *default_before_script
  script:
    - docker compose down
  environment:
    name: $CI_COMMIT_REF_SLUG
    action: stop
  when: manual